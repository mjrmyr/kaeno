<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790" role="img" aria-labelledby="title desc">
<title id="title">Kaeno: durable teams on isolated hardware</title><desc id="desc">Clients connect to a single authenticated gateway and control plane. A versioned agent registry feeds scheduling into separately sandboxed Pi Durable supervisor and specialist runtimes. Durable inboxes and event receipts connect supervision and work. Work runs in cloud or self-hosted pools, with secret brokerage, fenced ownership, and separate persistent stores.</desc>
<defs><style>text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#eaf3f6}.sub{fill:#9fb8c1;font-size:16px}.label{font-size:13px;font-weight:750;letter-spacing:2px;fill:#80d7c6}.head{font-size:24px;font-weight:720}.small{font-size:15px;fill:#b8ccd1}.wire{stroke:#78ceb9;stroke-width:2.5;fill:none}.dash{stroke:#e4aa6a;stroke-width:2.5;stroke-dasharray:7 6;fill:none}</style><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#78ceb9"/></marker><marker id="warn" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#e4aa6a"/></marker></defs>
<rect width="1280" height="790" rx="22" fill="#0d1923"/><text x="52" y="58" font-size="32" font-weight="760">Kaeno <tspan fill="#80d7c6">/</tspan> agents that stay on the job</text><text x="52" y="88" class="sub">Remote access is the front door. Durable ownership and isolated execution are the foundation.</text>
<rect x="52" y="122" width="260" height="125" rx="16" fill="#1b3040" stroke="#3b5c6a"/><text x="72" y="153" class="label">01 / ACCESS</text><text x="72" y="188" class="head">Any client</text><text x="72" y="215" class="small">Terminal · web · mobile</text>
<rect x="388" y="122" width="322" height="125" rx="16" fill="#1b3040" stroke="#3b5c6a"/><text x="408" y="153" class="label">02 / IDENTITY &amp; ROUTING</text><text x="408" y="188" class="head">Authenticated gateway</text><text x="408" y="215" class="small">ACLs · commands · replayable streams</text>
<path d="M312 184H379" class="wire" marker-end="url(#arr)"/>
<rect x="794" y="122" width="434" height="125" rx="16" fill="#163639" stroke="#44887e"/><text x="814" y="153" class="label">03 / CONTROL PLANE · POSTGRES</text><text x="814" y="188" class="head">Team + assignment ledger</text><text x="814" y="215" class="small">Inboxes · outboxes · timers · lease epochs</text>
<path d="M710 184H784" class="wire" marker-end="url(#arr)"/>
<rect x="52" y="298" width="344" height="123" rx="16" fill="#1b3040" stroke="#3b5c6a"/><text x="72" y="330" class="label">TRUSTED CATALOG</text><text x="72" y="365" class="head">Agent registry</text><text x="72" y="393" class="small">Pinned skills · knowledge · policy ceiling</text>
<rect x="450" y="298" width="343" height="123" rx="16" fill="#1b3040" stroke="#3b5c6a"/><text x="470" y="330" class="label">PLACEMENT</text><text x="470" y="365" class="head">Scheduler + reconciler</text><text x="470" y="393" class="small">Trust tier · capacity · fence-or-block</text>
<path d="M396 356H440" class="wire" marker-end="url(#arr)"/><path d="M1010 247V275H622V289" class="wire" marker-end="url(#arr)"/>
<rect x="844" y="298" width="384" height="123" rx="16" fill="#302c28" stroke="#a67f51"/><text x="864" y="330" font-size="13" font-weight="750" letter-spacing="2" fill="#e4aa6a">PRIVILEGE BOUNDARY</text><text x="864" y="365" class="head">Secret + policy broker</text><text x="864" y="393" class="small">Scoped credentials; no keys in prompts</text>
<rect x="52" y="471" width="565" height="231" rx="20" fill="#152c35" stroke="#44887e" stroke-width="2"/><text x="76" y="505" class="label">SUPERVISOR CELL · LONG-LIVED</text><text x="76" y="542" class="head">Team lead</text><text x="76" y="570" class="small">Pi Durable Harness + private store + sandbox</text><text x="76" y="603" class="small">Reviews milestones, checks in, steers sparingly</text><rect x="76" y="629" width="515" height="49" rx="10" fill="#234449"/><text x="91" y="660" font-size="16">Bounded review rounds · cooldown · human escalation</text>
<rect x="669" y="471" width="559" height="231" rx="20" fill="#202b3b" stroke="#7890ba" stroke-width="2"/><text x="693" y="505" class="label">ASSIGNMENT CELLS · EPHEMERAL</text><text x="693" y="542" class="head">Specialists · one sandbox per job</text><text x="693" y="570" class="small">Each: Pi Durable + private store + workspace</text><text x="693" y="603" class="small">Job-specific tools, network, env and scoped keys</text><rect x="693" y="629" width="509" height="49" rx="10" fill="#344154"/><text x="708" y="660" font-size="16">OCI / microVM on trusted cloud or self-hosted hosts</text>
<path d="M608 421V462" class="wire" marker-end="url(#arr)"/><path d="M690 421V448H949V462" class="wire" marker-end="url(#arr)"/><path d="M845 359H816V443H946V463" class="dash" marker-end="url(#warn)"/>
<path d="M617 577H658" class="wire" marker-end="url(#arr)"/><path d="M669 608H626" class="dash" marker-end="url(#warn)"/><text x="600" y="564" font-size="12" fill="#80d7c6">STEER →</text><text x="603" y="627" font-size="12" fill="#e4aa6a">← EVENTS</text>
<text x="52" y="751" class="sub">One owner per store · no shared Harness · ordered receipts, not cross-store transactions · uncertain host loss blocks failover</text>
</svg>
