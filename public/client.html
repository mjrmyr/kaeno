<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kaeno / assignments</title><link rel="icon" href="data:,"><style>:root{font-family:system-ui,sans-serif;color-scheme:dark;background:#101b25;color:#e5f1f0}body{max-width:760px;margin:30px auto;padding:0 18px}h1{color:#82d9c7}p{color:#b6cbd0;line-height:1.5}input,textarea,select,button{font:inherit;padding:12px;color:inherit;background:#213645;border:1px solid #54747a;border-radius:8px}input,textarea,select{width:100%;margin:6px 0 16px}textarea{min-height:94px}button{cursor:pointer;background:#236a60}button:hover{background:#358d7d}article{border:1px solid #35505c;border-radius:11px;padding:16px;margin:12px 0;overflow-wrap:anywhere}small{color:#9dc3c1}pre{white-space:pre-wrap;overflow-wrap:anywhere}#notice{color:#eac999}label{font-weight:600}</style></head><body><h1>Kaeno / assignments</h1><p>Prototype: one service and sandboxed specialist per assignment. This client never opens a Pi Durable store. Authenticate with the token in <code>.kaeno-next/token</code> on the service host; use HTTPS through a trusted reverse proxy for remote access.</p><label for="token">Service token (kept only in this tab)</label><input id="token" type="password" autocomplete="off"><button id="connect">Connect</button><p id="notice" role="status"></p><section id="app" hidden><label for="agent">Agent</label><select id="agent"></select><label for="objective">Assignment</label><textarea id="objective" placeholder="Describe the work"></textarea><button id="submit">Assign</button><h2>Saved assignments</h2><div id="jobs"></div></section><script>const $=id=>document.getElementById(id);let after=0;async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{Authorization:'Bearer '+$('token').value,'content-type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');return data}async function refresh(){try{const list=await api('/api/assignments');$('jobs').replaceChildren(...list.map(j=>{const el=document.createElement('article');const h=document.createElement('strong');h.textContent=j.agent+' · '+j.state+' · '+j.id;const objective=document.createElement('p');objective.textContent=j.objective;const result=document.createElement('pre');result.textContent=j.result||j.error||'';el.append(h,objective,result);if(j.state==='running'){const input=document.createElement('input');input.placeholder='Steer this assignment';const button=document.createElement('button');button.textContent='Send guidance';button.onclick=async()=>{try{await api('/api/assignments/'+j.id+'/steer','POST',{requestId:crypto.randomUUID(),text:input.value});input.value='';await refresh()}catch(e){$('notice').textContent=e.message}};el.append(input,button)}return el}));const events=await api('/api/events?after='+after);if(events.length)after=events.at(-1).seq}catch(e){$('notice').textContent=e.message}}$('connect').onclick=async()=>{try{const agents=await api('/api/agents');$('agent').replaceChildren(...agents.map(a=>{const o=document.createElement('option');o.value=a.name;o.textContent=a.name+' · '+a.skills.join(', ');return o}));$('app').hidden=false;$('notice').textContent='Connected';await refresh();setInterval(refresh,1200)}catch(e){$('notice').textContent=e.message}};$('submit').onclick=async()=>{try{await api('/api/assignments','POST',{requestId:crypto.randomUUID(),agent:$('agent').value,objective:$('objective').value});$('objective').value='';await refresh()}catch(e){$('notice').textContent=e.message}}</script></body></html>
