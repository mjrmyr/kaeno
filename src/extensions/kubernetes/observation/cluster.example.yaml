# REVIEW ONLY. No code applies these manifests. Replace namespaces, images, API CIDR,
# host labels and TLS names for your cluster. Requires an enforcing CNI.
# Create observer-system and pilot namespaces separately.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kaeno-observer
  namespace: observer-system
---
# Repeat only this Role and RoleBinding in each explicitly approved namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kaeno-observer
  namespace: pilot
rules:
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims]
    verbs: [list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [list]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kaeno-observer
  namespace: pilot
subjects:
  - kind: ServiceAccount
    name: kaeno-observer
    namespace: observer-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kaeno-observer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kaeno-observer-config
  namespace: observer-system
data:
  config.json: |
    {
      "namespaces": ["pilot"],
      "includeNodes": false,
      "clientTokenFile": "/credentials/token",
      "pollIntervalMs": 60000,
      "staleAfterMs": 180000
    }
  nginx.conf: |
    pid /tmp/nginx.pid;
    error_log /dev/stderr crit;
    events { worker_connections 64; }
    http {
      access_log off;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      server {
        listen 8443 ssl;
        ssl_certificate /tls/tls.crt;
        ssl_certificate_key /tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 1k;
        location = /v1/snapshot {
          proxy_pass http://127.0.0.1:8080;
          proxy_buffering off;
          proxy_read_timeout 15s;
        }
        location / { return 404; }
      }
    }
---
# Provision observer-client-token (key: token, >=32 random characters) and observer-tls
# (kubernetes.io/tls, certificate valid for the Service DNS name) out of band.
# Mount a separate copy of the same client token on the HOST only, never workers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaeno-observer
  namespace: observer-system
spec:
  replicas: 1
  selector:
    matchLabels: { app: kaeno-observer }
  template:
    metadata:
      labels: { app: kaeno-observer }
    spec:
      serviceAccountName: kaeno-observer
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: observer
          image: ghcr.io/YOUR-OWNER/kaeno:YOUR-TAG
          command: [node, src/extensions/kubernetes/observation/main.ts]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/kaeno-observer, readOnly: true }
            - { name: client-token, mountPath: /credentials, readOnly: true }
            - name: api-credentials
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
        - name: tls
          image: nginx:stable-alpine
          command:
            [nginx, -c, /etc/kaeno-observer/nginx.conf, -g, "daemon off;"]
          ports: [{ name: https, containerPort: 8443 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/kaeno-observer, readOnly: true }
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: api-credentials
          projected:
            sources:
              - serviceAccountToken: { path: token, expirationSeconds: 3600 }
              - configMap:
                  name: kube-root-ca.crt
                  items: [{ key: ca.crt, path: ca.crt }]
        - name: config
          configMap: { name: kaeno-observer-config }
        - name: client-token
          secret: { secretName: observer-client-token }
        - name: tls
          secret: { secretName: observer-tls }
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: kaeno-observer
  namespace: observer-system
spec:
  selector: { app: kaeno-observer }
  ports: [{ name: https, port: 443, targetPort: https }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kaeno-observer
  namespace: observer-system
spec:
  podSelector:
    matchLabels: { app: kaeno-observer }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kaeno }
          podSelector:
            matchLabels: { app.kubernetes.io/name: kaeno }
      ports: [{ protocol: TCP, port: 8443 }]
  egress:
    # EXAMPLE ONLY: service/endpoint DNAT policy behavior varies by CNI.
    # Replace with the actual API service/control-plane endpoints and port(s).
    - to: [{ ipBlock: { cidr: 10.43.0.1/32 } }]
      ports: [{ protocol: TCP, port: 443 }]
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
