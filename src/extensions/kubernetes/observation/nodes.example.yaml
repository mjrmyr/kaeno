# OPTIONAL: grant separately ONLY after enabling includeNodes in observer AND host config.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kaeno-observer-nodes
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kaeno-observer-nodes
subjects:
  - kind: ServiceAccount
    name: kaeno-observer
    namespace: observer-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kaeno-observer-nodes
